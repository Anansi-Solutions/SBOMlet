# policy.example.toml -- starter policy for the third-party license tool.
#
# Copy this file (e.g. to policy.toml at your repo root) and pass it to the
# generator:
#
#     generate --policy policy.toml ...
#
# Without --policy the tool only inventories licenses; with it, every
# (package x workspace) occurrence gets a verdict: ok, warn, fail, or
# suppressed.
#
# Validation is strict: unknown keys, missing reasons/descriptions, invalid
# SPDX patterns, and malformed paths reject the whole file with ONE
# aggregated error report naming each problem's table path. Every override
# in this file requires written justification -- the reasons below are the
# audit trail your future self (or your lawyer) reads.
#
# Rule precedence (highest to lowest):
#   [[deny]]  -- TERMINAL: force-fails, beats every accept lever below
#   [[clarify]] override
#   [[compatible]] match = "package"
#   [[compatible]] match = "license"
#   [target] / [[target.workspace]] compatibility lane (only when a declared
#     target governs the occurrence; supersedes workspace suppression below)
#   [[workspace.copyleft_suppressed]]
#   category default (copyleft flag / [unknown] handling)

# ---------------------------------------------------------------------------
# Deny-list (POL-09) -- the HIGHEST-precedence, TERMINAL lane
#
# A [[deny]] entry FORCE-FAILS any matching (package x occurrence) regardless
# of dev/prod scope, workspace suppression, OR a [[compatible]] rule, or a
# stale override. It sits ABOVE everything else: a use-restricted
# ("source-available") license legally cannot be redistributed in
# client-shipped artifacts (including the IaC, container images, and modules
# this tool inventories), so no other policy lever may license it back in.
#
# Two match modes (exactly one per entry, mirroring [[compatible]]):
#   match = "license"  -- pattern is an SPDX ID or an OR of IDs, matched via
#                         spdx-satisfies on a pre-decomposed allowlist (never
#                         substring). AND patterns are rejected at validation.
#   match = "name"     -- pattern is an EXACT package NAME. The escape hatch for
#                         non-SPDX USE-RESTRICTION RIDERS like Commons-Clause,
#                         which is not a registered SPDX license and rides
#                         alongside another (e.g. "MIT AND Commons-Clause").
#                         Name-mode does NOT need a parseable license, so it
#                         catches a rider even on an unknown-finding package.
#
# OR-FINDING-vs-DENY ELECTION: a deny license-match is OR-election-consistent
# with [[compatible]]. An OR finding is denied ONLY when it cannot elect out of
# the deny set -- i.e. EVERY branch is denied. If ANY branch is acceptable, the
# dep elects it and is NOT denied: with a deny for "BUSL-1.1",
# "MIT OR BUSL-1.1" is NOT denied (MIT is electable), while a finding whose
# every branch is denied IS denied.
#
# Every license-mode SPDX id is validated against spdx-license-ids in the tests.
# RSAL (Redis Source Available License) has NO registered SPDX id, so it ships
# in NAME mode below, not license mode.
# ---------------------------------------------------------------------------

# NOTE: BUSL-1.1, SSPL-1.0, and Elastic-2.0 are DENIED BY DEFAULT — they ship with
# the tool (src/policy/builtinDenylist.ts), so you do NOT need to list them. Add a
# `[[deny]] match = "license"` entry only for ANOTHER source-available SPDX licence
# the defaults don't cover; the syntax mirrors the name-mode entries below.

[[deny]]
match = "name"
# RSAL (Redis Source Available License) has NO registered SPDX id, so it is
# matched by PACKAGE NAME, not license. Adjust the name to the package(s) your
# inventory reports under this license (e.g. "redis"). Documented as name-mode
# precisely because the SPDX-satisfies path cannot catch a non-SPDX license.
pattern = "redis"
reason = "Redis Source Available License (RSAL/RSALv2) is source-available with use restrictions and has no registered SPDX id; matched by package name. Use-restricted -- cannot be redistributed, terminal deny. Replace/extend the name to match the RSAL-licensed package(s) in your inventory."

[[deny]]
match = "name"
# Commons-Clause is a USE-RESTRICTION RIDER, not an SPDX license: it rides on
# top of another license (e.g. "MIT AND Commons-Clause") and removes the right
# to SELL the software. The SPDX-satisfies path cannot catch a non-SPDX rider,
# so it is matched by PACKAGE NAME. Set this to the package(s) your inventory
# reports carrying the Commons-Clause rider.
pattern = "commons-clause-licensed-package"
reason = "Commons-Clause is a use-restriction rider (no resale) layered onto another license; it is not a registered SPDX id and rides alongside its base license, so it is matched by name. Use-restricted -- terminal deny. Replace the name with the Commons-Clause-encumbered package(s) in your inventory."

# ---------------------------------------------------------------------------
# Workspace copyleft suppression
#
# When a workspace is ITSELF distributed under a copyleft license, in-family
# copyleft dependencies impose no additional obligations within it. Each
# entry suppresses copyleft findings for occurrences whose target is `path`
# or lives under it (segment-aware: "apps/scratch" never matches a
# hypothetical "apps/scratch-helper"). An occurrence of the same package in
# a NON-suppressed workspace still flags -- suppression is per occurrence,
# never per package.
#
# Suppression is FAMILY-AWARE: a finding is only suppressed when its
# elected expression satisfies the workspace `license` itself, OR every
# copyleft obligation in it belongs to the same license family as the
# workspace license. The GNU family spans AGPL/GPL/LGPL, so an
# AGPL-3.0-only workspace suppresses AGPL, GPL, and LGPL findings -- but
# never SSPL, CC-BY-SA, MPL, or any other out-of-family copyleft finding,
# which falls through to the normal fail default instead. The generated
# verdict reason records WHICH relationship was verified (the audit
# trail). Family grouping is deliberately coarse; use [[compatible]] for
# precise per-license or per-package judgment calls.
# ---------------------------------------------------------------------------

[[workspace.copyleft_suppressed]]
# Repo-relative workspace path: forward slashes only, no leading/trailing
# slash, no ".." segments. An empty path would suppress everything and is
# rejected.
path = "apps/scratch"
# The SPDX license this workspace is distributed under (validated eagerly).
# Must be a SINGLE license ID, not an expression: it anchors the in-family
# check above.
license = "AGPL-3.0-only"
# Mandatory documentation: WHY suppression is justified here.
description = "apps/scratch and its scratch-editor submodule are themselves distributed under AGPL-3.0-only; the bundled scratch-* AGPL dependencies are in-family copyleft and impose no additional obligations within this workspace."

# ---------------------------------------------------------------------------
# Compatible overrides
#
# Two match modes. `match` also decides how `pattern` is read: an SPDX
# expression at license level, a package-name glob at package level.
#
#   match = "license"  -- pattern is an SPDX ID or an OR of IDs, matched via
#                         spdx-satisfies semantics (never substring). AND
#                         patterns are rejected: an AND cannot be satisfied
#                         by a single allowlist entry.
#   match = "package"  -- one exact `name`, or a `pattern` covering a family
#                         of names, optionally pinned to versions.
#
# `where` is REQUIRED on both: state which occurrences you judged. Use
# ["/"] to mean every occurrence -- deliberately repository-wide, and
# visibly so.
#
# `rationale` is a closed set -- the tool can only check a claim it
# understands. `comment` carries what it cannot, and is optional by design.
#
#   build-time-only        consumed while building, absent from what ships
#   development-tool-only  a tool for working on the repository, never
#                          reached by the product
#   license-reviewed       a human read the license and accepted its
#                          obligations. The fallback when no structural
#                          reason applies
#   os-package-unmodified  a distribution package shipped inside a container
#                          image exactly as it arrived, not linked into the
#                          software
#   unused-transitive      pulled in by a dependency but never reached at
#                          runtime
#
# `as-dependency-of` is REQUIRED at package level: the packages whose use of
# this one you judged, by name, or ["self"] for your own software. It scopes
# the acceptance to how the package arrives, so the same package arriving
# through some other chain does not inherit the judgment. It is NOT
# applicable at license level, where `where` alone scopes the acceptance.
# ---------------------------------------------------------------------------

[[compatible]]
match = "license"
# A single SPDX ID; "(MPL-2.0 OR MPL-1.1)" would also be accepted, while
# "MPL-2.0 AND MIT" would be rejected at validation time.
pattern = "MPL-2.0"
rationale = "license-reviewed"
where = ["/"]
comment = "Weak copyleft; compatible under AGPL-3.0 and Apache License v2.0."

[[compatible]]
match = "package"
# Exact package name (the inventory's name, e.g. the npm name). Swap for
# `pattern = "@img/sharp-*"` to cover the whole family of platform binaries.
name = "@img/sharp-win32-x64"
# Optional: pin the exception to one version, or to a list; omit to cover
# all versions.
version = "0.34.5"
# The acceptance was judged for the image pipeline's use of it, not for any
# other chain that might pull the same binaries in.
as-dependency-of = ["image-pipeline"]
rationale = "license-reviewed"
where = ["apps/media"]
comment = "Dual-licensed Apache-2.0 AND LGPL-3.0-or-later; the LGPL obligations are reviewed and accepted for these prebuilt binaries."

# ---------------------------------------------------------------------------
# Target-license compatibility lane ([target] / [[target.workspace]])
#
# Instead of hand-authoring [[compatible]]/[[deny]] entries for every
# dependency license, declare your OWN software's usage profile and the tool
# decides compatibility against it using a vetted license-compatibility
# matrix. Commented out below (inert) -- SBOMlet itself does not declare a
# target in this shipped example.
#
# ALL THREE profile keys below are MANDATORY together if you declare one at
# all (no defaults -- declaring a target is a load-bearing choice):
#   license      -- one FOSS SPDX id, or the literal "proprietary". A
#                   compound expression or a LicenseRef-/DocumentRef-
#                   reference is rejected (dual-licensed targets aren't
#                   supported yet).
#   network      -- boolean. Gates whether the AGPL/section-13 obligation
#                   class is IN SCOPE, never the verdict itself: true keeps
#                   it in scope regardless of distribution (the
#                   compatibility relation then decides); false folds AGPL
#                   into the ordinary copyleft class instead.
#   distribution -- "external" or "internal". "internal" takes the
#                   distribution-triggered copyleft class OUT OF SCOPE for a
#                   positively-known obligation (target:internal-use,
#                   visible in its own report list -- never a silent pass).
#
# unknown_pair ("warn"/"fail", defaults to "warn") is the residual knob for
# a license pair the vetted data doesn't cover -- mirrors [unknown].handling.
#
# This lane sits BELOW [[compatible]] (which still decides first) and ABOVE
# [[workspace.copyleft_suppressed]] (which a governed occurrence never
# reaches at all -- superseded, surfaced as a notice, never silently).
#
# [target]
# license = "MIT"
# network = false
# distribution = "external"
#
# [[target.workspace]]
# # Per-field inheritance from the project profile above: path/license/reason
# # are always mandatory here; network/distribution are OPTIONAL and inherit
# # the project profile's own value when omitted.
# path = "apps/studio"
# license = "AGPL-3.0-only"
# reason = "apps/studio bundles an AGPL-licensed editor component and ships under AGPL-3.0-only itself, not the project's MIT license."
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Clarify overrides (two-level, staleness-guarded — POL-07)
#
# Overrides come at TWO levels:
#   1. TOOL-LEVEL defaults ship WITH the tool (src/policy/builtinOverrides.ts):
#      curated disambiguations for commonly-ambiguous well-known projects (the
#      Jupyter/IPython BSD stack -> BSD-3-Clause, python-dateutil's "Dual
#      License" -> "Apache-2.0 OR BSD-3-Clause"). You benefit from these WITHOUT
#      re-authoring them.
#   2. PROJECT-LEVEL overrides are the [[clarify]] entries below.
# On conflict for the same package, the PROJECT level WINS (you can always
# override a shipped default).
#
# Every entry is a PRECONDITIONED assertion. `detected` records what each
# source reported when you wrote the entry:
#
#   registry   -- the quick answer: the package's own metadata, plus whatever
#                 registry enrichment resolved. Often not SPDX at all ("BSD",
#                 "Dual License") -- record it exactly as reported.
#   intensive  -- the in-depth source scan's answer.
#
# At least one source is required; `false` records that a source reports
# NOTHING. The entry applies ONLY while every source you recorded still reports
# what you wrote down. If one no longer does -- a relicense, a source that went
# quiet, a source that started reporting where it did not before -- the entry is
# STALE and the gate FAILS LOUDLY naming the source, the recorded value, and the
# current one. The stale assertion is NEVER applied, so an old entry can never
# silently mask a relicense.
#
# A disagreement between the two sources is only settled by an entry that
# recorded the `intensive` source: that is the entry stating which side you
# stand behind. Recording `registry` alone leaves the disagreement open.
#
# `justification` is a closed set -- the tool can only check a claim it
# understands. `comment` carries what the justification cannot, and is optional
# by design: use it only where it adds something.
#
#   contradictory-claims-recorded  sources disagree irreconcilably; the
#                                  expression is the reading you stand behind
#   declared-more-complete         the package's own metadata names licenses
#                                  the scan cannot see
#   dual-license-choice            the package offers a choice; the expression
#                                  records the one taken
#   license-not-found              no source states a license; the expression
#                                  comes from evidence outside detection
#   scan-found-additional-content  the scan sees further licenses that do
#                                  govern content the package ships
#   scan-more-precise              the scan resolves an under-specified
#                                  declared label to the exact license
#   scan-overdetection             the scan reports licenses from files that
#                                  do not govern the package
#
# `evidence` is an optional list of files or URLs a reader can check. It is
# recorded verbatim: the tool never fetches or verifies it.
#
# `expression` must be valid SPDX -- parsed at validation time, so a typo fails
# fast instead of mid-evaluation.
# ---------------------------------------------------------------------------

[[clarify]]
# `name` is an exact package name; `version` is optional (omit = all versions)
# and may be a list when several versions share the judgment.
name = "jsonify"
version = "0.0.1"
# Neither source states a license: the registry value is the non-SPDX string
# "Public Domain", and the scan found no license file at all.
detected = { registry = "Public Domain", intensive = false }
justification = "license-not-found"
expression = "Unlicense"
comment = "The README dedicates the package to the public domain; mapped to Unlicense deliberately."
evidence = ["node_modules/jsonify/README.md"]

# [[clarify]]
# `pattern` covers a FAMILY of packages by name instead of one exact name:
# `*` fills one name segment, `**` reaches across segments, and a trailing
# slash covers a whole scope. Exactly one of `name` and `pattern` per entry,
# and a pattern must carry a wildcard and at least one literal character.
# pattern = "@acme-dictionaries/"
# version = ["1.0.0", "1.0.1"]
# detected = { registry = "BSD", intensive = "BSD-3-Clause" }
# justification = "scan-more-precise"
# expression = "BSD-3-Clause"

# ---------------------------------------------------------------------------
# Unknown-license handling
#
# Governs packages whose license could not be determined (no claim at all,
# or a garbage value that neither parses nor corrects).
#
#   handling = "warn"  -- report unknowns but do not fail the gate.
#   handling = "fail"  -- treat every unknown as a violation.
#
# Start with "warn" while burning down the unknown population, then switch
# to "fail" once the inventory is clean. Per-ecosystem handling (e.g. fail
# for npm, warn for python) is future scope; this knob is global. Omitting
# the whole [unknown] table defaults to "warn".
# ---------------------------------------------------------------------------

[unknown]
handling = "warn"

# ---------------------------------------------------------------------------
# Development / build-time dependency handling (POL-08)
#
# Distinguishes development/build-time dependencies from production (distributed)
# ones IN THE GATE. A would-be FAIL (a copyleft license, or an unknown license
# under [unknown] handling = "fail") on a DEV-only occurrence is downgraded —
# because a build-time-only copyleft tool carries no distribution obligation,
# unlike a shipped library.
#
#   handling = "warn"    -- a dev would-be-fail downgrades to WARN (the default).
#   handling = "fail"    -- NO downgrade; gate dev EXACTLY like prod (the
#                           pre-POL-08 behavior, for strict projects).
#   handling = "ignore"  -- a dev would-be-fail becomes OK (an EXPLICIT,
#                           documented opt-out — use deliberately).
#
# This is PER-OCCURRENCE, never package-level: the SAME package used as a dev
# dependency in workspace A and a production dependency in workspace B still
# FAILS on the B (production) occurrence under "warn"/"ignore". A shipped
# copyleft can NEVER be dev-downgraded — production occurrences ALWAYS fail.
#
# Omitting the whole [dev_dependencies] table defaults to "warn".
# ---------------------------------------------------------------------------

[dev_dependencies]
handling = "warn"

# ---------------------------------------------------------------------------
# Where the tool's generated artifacts live ([cache])
#
# The enrichment cache and the committed Docker OS SBOM are written under one
# repo-root-relative directory, so they never scatter across your repo root.
# Omit the whole [cache] table to use the default `.sbomlet.cache/`. Point `dir`
# elsewhere (repo-relative, no "..") to keep the root pristine -- e.g. a .NET
# shop's `eng/` convention. Commit whatever directory you choose; `check` reads
# it offline.
#
#   [cache]
#   dir = "eng/.sbomlet.cache"
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Docker image-package handling (COLL-04)
#
# Governs the packages scanned out of your Docker images -- the full image
# contents in the committed .sbomlet.cache/docker.sbom.json, produced by the
# maintainer-run `generate-docker-sbom` subcommand and threaded into the merge as
# scope "os".
# A would-be FAIL on an OS package downgrades to WARN under "warn".
#
# WHY a separate, non-failing scope by default: the EXPECTED copyleft in a
# Debian/Alpine base image -- glibc (LGPL), bash/coreutils (GPL), and the rest
# of the distro -- is the operating system the container ships ON, not code your
# project authored or redistributes as a library. Those obligations are
# satisfied by shipping the image (the base distro handles its own compliance),
# so the gate LISTS the OS packages under their container's own subsection
# (below "## Containers") rather than FAILING your build on every standard
# base image. Mirrors [dev_dependencies]: a scope whose would-be fails are a
# list, not a gate, by default.
#
#   handling = "warn"    -- an OS would-be-fail downgrades to WARN (the default).
#   handling = "fail"    -- NO downgrade; gate OS packages EXACTLY like prod app
#                           code (for projects that vendor / rebuild their base
#                           and want every OS copyleft reviewed).
#   handling = "ignore"  -- an OS would-be-fail becomes OK (an EXPLICIT,
#                           documented opt-out).
#
# The [[deny]] terminal ALWAYS wins: a source-available / use-restricted license
# (BUSL, SSPL, Elastic, RSAL) in an OS package STILL FAILS the gate
# unconditionally, regardless of this knob -- deny sits above os_dependencies
# just as it sits above dev_dependencies. Omitting the whole [os_dependencies]
# table defaults to "warn". AGPL in an OS package is its OWN exception: it
# ALWAYS fails via "default:agpl-container", never downgraded by this knob --
# network-copyleft (section 13) reaches server-side use and is not routine
# base-image noise.
#
# ---------------------------------------------------------------------------
# HOW the .sbomlet.cache/docker.sbom.json is produced -- THREE lanes, each a
# way into the same result (syft over a real image's full contents). A run picks
# exactly one; all three require a docker daemon:
#
#   1. Build named Dockerfiles:
#        task generate DOCKER=1 DOCKERFILES="backend/Dockerfile app/Dockerfile"
#      Builds each Dockerfile to a deterministic local tag and scans the image it
#      produces -- its base, the packages its own RUN apt/apk steps add, and the
#      application layered on top.
#
#   2. Discover and build the repo's Dockerfiles:
#        task generate DOCKER=1
#      Walks the repo, builds each Dockerfile it finds (skipping any [docker]
#      ignore match), and scans the results -- what the Docker-scan workflow drives.
#
#   3. Scan pre-existing images:
#        task generate DOCKER=1 IMAGES="postgres:18 nginx:stable-alpine"
#      Scans each image ref with the pinned syft, pulling any that is absent
#      locally and digest-pinning each.
#
# Every lane writes the SAME deterministic committed .sbomlet.cache/docker.sbom.json,
# carrying each package's syft-resolved licenses, which generate/check then read
# OFFLINE (never re-scanning). The three lanes are mutually exclusive -- a run is
# one way in.
# ---------------------------------------------------------------------------

[os_dependencies]
handling = "warn"

# ---------------------------------------------------------------------------
# Marking a container development-only ([[docker.development]])
#
# Every analyzed container defaults to PRODUCTION. An entry here moves a
# matching container's packages to render under "## Development-only
# dependencies" instead of "## Production dependencies" -- for images that
# only run in CI or locally and are never shipped to a user (a lint runner, a
# test harness). RENDER-ONLY: it moves the LISTING, never a verdict -- a
# routine copyleft package inside the marked container still downgrades or
# gates per [os_dependencies] above, and an AGPL container package still fails
# unconditionally either way.
#
# `source` is a GLOB over the Dockerfile's repo-relative identity (no
# "docker:" prefix), matched with the EXACT SAME dialect as [docker].ignore
# above: "*" stays within one path segment, "**" crosses segments, matching is
# case-insensitive and anchored to the whole identity -- a literal path is a
# valid glob that matches only itself. `reason` is mandatory: the audit trail
# for why this image never ships. A `source` matching no analyzed container
# prints a stderr warning (a likely typo), mirroring the unused-rule posture
# elsewhere in this file.
# ---------------------------------------------------------------------------

# [[docker.development]]
# source = "ci/**"
# reason = "every image under ci/ only runs the test suite in the pipeline and is never published or shipped."

# ---------------------------------------------------------------------------
# Exempting a built-in source-available deny (ADR-0013)
#
# BUSL-1.1, SSPL-1.0, and Elastic-2.0 are DENIED BY DEFAULT. If you have a
# legitimate, reviewed reason to ship one anyway -- an internal-only build tool
# that is never redistributed, or a component you hold a separate licence for --
# list it here. The package then SURFACES AS A WARNING (visible, non-gating)
# instead of failing, so the accepted source-available licence never silently
# passes review. `reason` is mandatory: it is the audit trail.
#
# Scope: only the built-in defaults can be exempted. A licence YOU deny via
# [[deny]] is absolute and is never softened here, and a non-default licence is
# rejected (exempting something that was never denied by default is a mistake).
# ---------------------------------------------------------------------------

# [[allow_source_available]]
# license = "BUSL-1.1"
# reason = "Used only in the internal release tool that is never shipped to clients; reviewed and accepted by legal on 2026-06-24."
