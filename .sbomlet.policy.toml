# SBOMlet's own licence policy — the tool gates its own dependency inventory.
#
# The shipped source-available denies (BUSL/SSPL/Elastic) apply by default. Beyond
# that: unknown licences fail (the tool must always resolve its own), and a
# build-time-only copyleft downgrades to a warning since it is never redistributed.

# Package-level licence corrections live in their own file — entries recording
# what both sources reported when each was written, so an upstream relicense
# reopens the judgment instead of silently continuing to apply. That file is
# machine-owned: it holds [[clarify]] tables and nothing else, and prose about
# an entry belongs in its own comment/evidence keys.
clarifications = ".sbomlet.clarifications.toml"

[document]
title = "SBOMlet — Third-Party Licenses"

[unknown]
handling = "fail"

[dev_dependencies]
handling = "warn"

[os_dependencies]
handling = "warn"

# SBOMlet's own usage profile: MIT-licensed, available online (so the
# AGPL/section-13 obligation class stays in scope regardless of distribution),
# and externally distributed as a published tool. Declaring this activates
# the compatibility lane below, classifying every dependency against MIT
# instead of relying solely on the hand-authored rules above.
[target]
license = "MIT"
network = true
distribution = "external"

[docker]
# The Dockerfile-name-pattern walk is intentionally name-only (no content
# sniffing), so it also matches the tool's own source files that merely SHARE
# the "dockerfile.<suffix>" naming convention (the discovery module itself and
# its test). Neither is a real Dockerfile; handing either to docker build would
# abort the run. Excluded from the Docker-scan workflow's build set.
ignore = ["src/collectors/dockerfile.ts", "test/dockerfile.test.ts"]

# `source` is a glob over Dockerfile identities, matched exactly like
# the [docker] ignore globs; a literal path matches one image.
[[docker.development]]
source = "examples/docker-scan/Dockerfile"
reason = "Demo image for the docker-scan example; built only to exercise the scanner, never deployed or distributed."

# The dogfood image (examples/docker-scan) is Alpine-based; its OS layer ships
# unmodified distro packages whose copyleft obligations are met by the distro
# itself (source via Alpine aports; the image aggregates, never derives).
# Reviewed and accepted per package -- version-independent judgments, so the
# rules are unpinned and survive base-image bumps. Each acceptance is scoped
# via `where` to the occurrence it was judged in: this image's OS layer. The
# image root is the introducer for every one of them: an image's OS layer has
# no dependency graph, so `self` is the honest parent there.

[[compatible]]
match = "package"
name = "busybox"
as-dependency-of = ["self"]
rationale = "os-package-unmodified"
where = ["docker:examples/docker-scan/Dockerfile"]

[[compatible]]
match = "package"
name = "busybox-binsh"
as-dependency-of = ["self"]
rationale = "os-package-unmodified"
where = ["docker:examples/docker-scan/Dockerfile"]

[[compatible]]
match = "package"
name = "ssl_client"
as-dependency-of = ["self"]
rationale = "os-package-unmodified"
where = ["docker:examples/docker-scan/Dockerfile"]

[[compatible]]
match = "package"
name = "apk-tools"
as-dependency-of = ["self"]
rationale = "os-package-unmodified"
where = ["docker:examples/docker-scan/Dockerfile"]

[[compatible]]
match = "package"
name = "libapk2"
as-dependency-of = ["self"]
rationale = "os-package-unmodified"
where = ["docker:examples/docker-scan/Dockerfile"]

[[compatible]]
match = "package"
name = "alpine-baselayout"
as-dependency-of = ["self"]
rationale = "os-package-unmodified"
where = ["docker:examples/docker-scan/Dockerfile"]

[[compatible]]
match = "package"
name = "alpine-baselayout-data"
as-dependency-of = ["self"]
rationale = "os-package-unmodified"
where = ["docker:examples/docker-scan/Dockerfile"]

[[compatible]]
match = "package"
name = "scanelf"
as-dependency-of = ["self"]
rationale = "os-package-unmodified"
where = ["docker:examples/docker-scan/Dockerfile"]

[[compatible]]
match = "package"
name = "musl-utils"
as-dependency-of = ["self"]
rationale = "os-package-unmodified"
where = ["docker:examples/docker-scan/Dockerfile"]

# The two certificate packages are not the unmodified-distro formula: their
# MPL-2.0 half is file-level copyleft, read and accepted on its own terms.

[[compatible]]
match = "package"
name = "ca-certificates"
as-dependency-of = ["self"]
rationale = "license-reviewed"
where = ["docker:examples/docker-scan/Dockerfile"]
comment = "MPL-2.0 file-level copyleft, satisfied by shipping the files unmodified in the OS layer."

[[compatible]]
match = "package"
name = "ca-certificates-bundle"
as-dependency-of = ["self"]
rationale = "license-reviewed"
where = ["docker:examples/docker-scan/Dockerfile"]
comment = "MPL-2.0 file-level copyleft, satisfied by shipping the files unmodified in the OS layer."
