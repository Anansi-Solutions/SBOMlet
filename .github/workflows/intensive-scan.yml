name: Intensive license scan

# Runs ScanCode against local source trees the registries left unresolved, and
# opens a PR with any refreshed cache entries. The deep-scan lane is monthly and
# slow, so it runs on a schedule plus manual dispatch only, never on every push
# -- and its output reaches the default branch only through a reviewable PR,
# never an unreviewed direct commit, so a wrong artifact is caught in review
# rather than after it has already landed. Usually a no-op: no changes -> no PR.
# This workflow triggers on schedule/dispatch only, so merging the PR it opens
# never re-triggers it. See docs/guides/ci-integration.md for the full story.
on:
  schedule:
    - cron: "17 4 1 * *" # monthly: the burn-down set is small and changes slowly
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    # The first full-set run backfills the analysis memo (measured ~16-75
    # minutes on this repo); later runs only scan versions never analyzed.
    timeout-minutes: 240
    permissions:
      contents: write # createCommitOnBranch writes the refresh onto its own branch
      pull-requests: write # ...which is opened as a PR rather than committed to the default branch
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
        with:
          # No step uses authenticated git; the commit-back goes through
          # github-script's own token instead.
          persist-credentials: false

      - name: Set up the SBOMlet toolchain
        # scancode-toolkit is pinned in mise.toml like every other tool, so
        # this one step provisions it -- no ad-hoc acquisition here.
        uses: jdx/mise-action@v4

      - name: Run the intensive scan
        # Same command a developer runs locally, with a longer per-package
        # timeout: CI runners are slower than a local machine, and a package
        # that still exceeds this is skipped and retried next run rather than
        # aborting the whole job (the job ceiling above stays the backstop).
        run: mise x -- task generate INTENSIVE=1 SCANCODE_TIMEOUT=30

      - name: Open a PR with refreshed cache entries
        uses: actions/github-script@v8
        with:
          script: |
            await require('./.github/scripts/commit-artifacts.cjs')(
              { github, context, core },
              {
                // The scan may only ever touch these paths -- anything else
                // dirty is an earlier step's bug, not something to sweep into
                // this refresh.
                scope: [".sbomlet.cache", "THIRD_PARTY_LICENSES.md", "THIRD_PARTY_NOTICES.md"],
                message: "chore: refresh intensive scan artifacts",
                pullRequest: true,
              },
            );
