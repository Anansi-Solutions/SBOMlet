# Maintainer tasks for SBOMlet — everything you need when changing the tool
# itself, split out so consumers who include Taskfile.yml aren't encumbered by
# them. Deliberately desc-less: `task --list` shows only described tasks, so
# these stay out of a consumer's list while remaining callable here by name
# (`task lint`, `task quality`, ...). Discover them with `task --list-all`;
# read a task's documentation with `task <name> --summary`.
#
# Most tasks are fingerprinted (`sources`): a re-run with unchanged inputs is a
# no-op. The state lives in .task/ (gitignored); delete it to force a run.
version: '3'

tasks:
  lint:
    summary: |
      Check the source with ESLint. Formatting runs as a lint rule
      (prettier/prettier), so this is also the format check; `task lint:fix`
      rewrites what is auto-fixable. Fingerprinted: skipped while no lint
      input changed since the last clean pass.
    deps: [install]
    sources:
      - 'src/**/*.ts'
      - 'test/**/*.ts'
      - 'scripts/**/*.ts'
      - 'tools/**/*.mjs'
      - 'tools/**/*.ts'
      - '.github/scripts/**/*.cjs'
      - eslint.config.mjs
      - .prettierrc
      - .prettierignore
      - package.json
      - bun.lock
    cmds:
      - mise x -- bun run lint

  lint:fix:
    summary: |
      Rewrite whatever `task lint` reports that is auto-fixable, formatting
      included. Never fingerprinted, so it always runs when invoked.
    deps: [install]
    cmds:
      - mise x -- bun run lint:fix

  typecheck:
    summary: |
      Type-check the tree with tsc --noEmit (strict mode). Fingerprinted:
      skipped while no TypeScript input changed since the last clean pass.
    deps: [install]
    sources:
      - 'src/**/*.ts'
      - 'test/**/*.ts'
      - 'scripts/**/*.ts'
      - tsconfig.json
      - package.json
      - bun.lock
    cmds:
      - mise x -- bun run typecheck

  quality:
    summary: |
      The quality gate — lint (formatting included), typecheck, then the
      comment-density budget. Lint and typecheck are fingerprinted, so a
      clean re-run is a no-op. Run it, with the test suite, before every
      commit.
    cmds:
      - task: lint
      - task: typecheck
      - task: metrics:comments:check

  test:
    # The label keys the fingerprint per CLI_ARGS value, so a filtered run
    # (`task test -- render.test.ts`) can never stamp the FULL suite as fresh.
    label: 'test{{if .CLI_ARGS}} ({{.CLI_ARGS}}){{end}}'
    summary: |
      Run the test suite. `task test -- <args>` forwards args verbatim to the
      runner (a file path, a --test-name-pattern, ...). Fingerprinted per
      argument set: a re-run with unchanged inputs is a no-op; a filtered run
      never counts as a full-suite pass.
    deps: [install]
    sources:
      - 'src/**'
      - 'test/**'
      - 'scripts/**'
      - 'tools/**'
      - '.github/**'
      - Taskfile.yml
      - Taskfile.dev.yml
      - policy.example.toml
      - mise.toml
      - tsconfig.json
      - eslint.config.mjs
      - package.json
      - bun.lock
    cmds:
      - mise x -- bun test {{.CLI_ARGS}}

  test:watch:
    summary: |
      Re-run tests on file change. `task test:watch -- <args>` forwards args
      like test does.
    interactive: true
    deps: [install]
    cmds:
      - mise x -- bun test --watch {{.CLI_ARGS}}

  metrics:comments:
    summary: |
      Report comment density over src/ — comment lines vs non-blank lines,
      comment words vs word tokens, per file and total. The budget itself
      is enforced by `task quality` and test/comment-metrics.test.ts.
    deps: [install]
    cmds:
      - mise x -- bun scripts/comment-metrics.ts

  metrics:comments:check:
    summary: |
      Enforce the comment-density budget over src/ — the gate form of
      metrics:comments (nonzero exit when comment lines or words exceed
      budget). `task quality` runs this; the same budget is covered by
      test/comment-metrics.test.ts.
    deps: [install]
    cmds:
      - mise x -- bun scripts/comment-metrics.ts --check

  adr:new:
    summary: |
      Scaffold an architecture decision record from the MADR template into
      docs/explanation/adr/ with the next free number.

      Variables:
        TITLE  the decision title (required): task adr:new TITLE="Short decision title"
    cmds:
      - mise x -- bun scripts/new-adr.ts {{.TITLE | default "" | q}}

  compat:data:update:
    summary: |
      Update the vendored license-compatibility snapshots under
      src/policy/compat/ (the OSADL matrix, the OSADL copyleft class table,
      the ScanCode LicenseDB index). Probes the upstream freshness timestamp,
      downloads all three from their fixed URLs, size-gates them, validates
      them with the same narrows the loader uses plus structural shape
      assertions, runs the inter-tier disagreement gate against the
      currently committed pair, and prints a diff summary — writing nothing
      until every check passes. Rewrites PROVENANCE.md with the new
      retrieval timestamps and sha256 hashes. Needs the network; never
      fingerprinted, never run by CI or `task check`. Run the full suite
      afterward: a pinning test failure means a reviewed verdict flipped and
      needs human review before the update is committed. A newly introduced
      inter-tier disagreement aborts the run; pass
      `-- --accept-new-disagreements` only after reviewing the listed pairs, to
      write them into the committed baseline (the one way to restore a
      disagreement an earlier bad update had masked).
    cmds:
      - mise x -- bun scripts/update-compat-data.ts {{.CLI_ARGS}}

  canary:dotnet:
    summary: |
      Probe the packages.lock.json format against the .NET SDK on PATH:
      restore a throwaway pinned project with a lockfile and run the nuget
      collector over the result, asserting the expected purls come out.
      Needs a .NET SDK installed; never fingerprinted — the input is the
      SDK, not this tree. CI runs it monthly with the newest GA SDK
      (.github/workflows/dotnet-canary.yml).
    deps: [install]
    cmds:
      - mise x -- bun scripts/dotnet-canary.ts

  arch:check:
    summary: |
      Validate the tool's own source against the architecture rules in
      .dependency-cruiser.cjs: no dependency cycles, no orphan modules, no
      import from test/ into src/, and the layering invariants (a
      dependency-free model/validate foundation, collectors that stay below
      policy and render, render that never reaches back into data production).
      Proposed governance only — NOT wired into `task check` or CI; adopt it by
      raising the rules to error severity and adding it to the gate once the
      tree passes clean. dependency-cruiser is run through bunx at a pinned
      version and is deliberately kept out of package.json so its transitive
      tree never enters the tool's own dependency inventory; it borrows the
      typescript already installed for typecheck via NODE_PATH. Exit code is the
      number of error-level violations (cycles are surfaced as warnings today).
    deps: [install]
    env:
      NODE_PATH: '{{.ROOT_DIR}}/node_modules'
    cmds:
      - mise x -- bunx dependency-cruiser@18.2.0 --config .dependency-cruiser.cjs --output-type err src

  arch:graph:
    summary: |
      Print the directory-level dependency graph of src/ as Mermaid text on
      stdout — own code only, collapsed to one node per top-level folder. Paste
      it into any Mermaid viewer, or into a Markdown file where it renders on
      GitHub without graphviz. A regenerable snapshot lives in
      docs/explanation/module-dependencies.md. Same pinned-bunx / NODE_PATH
      setup as arch:check; writes nothing.
    deps: [install]
    env:
      NODE_PATH: '{{.ROOT_DIR}}/node_modules'
    cmds:
      - mise x -- bunx dependency-cruiser@18.2.0 --config .dependency-cruiser.cjs --include-only "^src" --collapse "^src/[^/]+" --output-type mermaid src
